<app-top-bar #topbar />

<div class="shell" [class.is-narrow]="sidebar.isNarrow()">
  <aside
    #panel
    id="sidebar"
    class="panel"
    [class.is-visible]="sidebar.visible()"
    [inert]="!sidebar.visible()"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <app-sidebar />
  </aside>

  @if (sidebar.isNarrow() && sidebar.drawerOpen()) {
    <div class="backdrop" aria-hidden="true" (click)="closeDrawer()"></div>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>

@if (sidebar.isNarrow()) {
  <app-bottom-bar [adjacent]="adjacent()" />
}
