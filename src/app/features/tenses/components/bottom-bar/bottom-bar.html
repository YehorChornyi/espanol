<nav class="bottombar" aria-label="Швидка навігація">
  @if (adjacent().previous; as previous) {
    <a
      class="step step--previous"
      [routerLink]="['/', previous.id]"
      [attr.aria-label]="'Попередній час: ' + previous.name"
    >
      <svg class="step-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          d="M15 5l-7 7 7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="step-name">{{ previous.name }}</span>
    </a>
  } @else {
    <span class="step" aria-hidden="true"></span>
  }

  <button
    type="button"
    class="bottom-menu"
    aria-controls="sidebar"
    [attr.aria-expanded]="sidebar.visible()"
    (click)="sidebar.toggle()"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        d="M4 6h16M4 12h16M4 18h16"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
    Часи
  </button>

  @if (adjacent().next; as next) {
    <a
      class="step step--next"
      [routerLink]="['/', next.id]"
      [attr.aria-label]="'Наступний час: ' + next.name"
    >
      <span class="step-name">{{ next.name }}</span>
      <svg class="step-arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          d="M9 5l7 7-7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>
  } @else {
    <span class="step" aria-hidden="true"></span>
  }
</nav>
