<header class="topbar">
  <button
    #toggle
    type="button"
    class="menu-toggle"
    aria-controls="sidebar"
    [attr.aria-expanded]="sidebar.visible()"
    [attr.aria-label]="sidebar.visible() ? 'Сховати меню' : 'Показати меню'"
    (click)="sidebar.toggle()"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path
        d="M4 6h16M4 12h16M4 18h16"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">ñ</span>
    Іспанські часи
  </a>
</header>
